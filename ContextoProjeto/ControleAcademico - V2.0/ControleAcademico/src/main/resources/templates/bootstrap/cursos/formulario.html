<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Curso — Sistema Acadêmico</title><link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
<link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/></head><body><div th:replace="~{bootstrap/fragmentos/menu :: menu}"></div><main class="container app-conteudo py-4 app-page"><section class="app-surface"><h1 class="h3 mb-2" th:text="${curso.id == null} ? 'Novo Curso' : 'Editar Curso'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><section class="card shadow-sm border-0"><div class="card-body p-4"><form method="post" th:action="@{/bootstrap/cursos/salvar}"><input name="id" th:value="${curso.id}" type="hidden"/><div class="mb-3"><label class="form-label fw-semibold" for="nome">Nome</label><input class="form-control" id="nome" maxlength="100" name="nome" required="" th:value="${curso.nome}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="sigla">Sigla</label><input class="form-control" id="sigla" maxlength="20" name="sigla" required="" th:value="${curso.sigla}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="departamentoId">Departamento</label><select class="form-select" id="departamentoId" name="departamentoId" required=""><option value="">Selecione...</option><option th:each="op : ${departamentos}" th:selected="${curso.departamento != null and curso.departamento.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div><div class="d-flex gap-2 flex-wrap mt-4"><button class="btn btn-primary" type="submit">Salvar</button><a class="btn btn-outline-secondary" th:href="@{/bootstrap/cursos}">Cancelar</a></div></form></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
