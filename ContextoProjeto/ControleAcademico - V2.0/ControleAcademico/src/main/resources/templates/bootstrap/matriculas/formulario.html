<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Matrícula — Sistema Acadêmico</title><link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
<link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/></head><body><div th:replace="~{bootstrap/fragmentos/menu :: menu}"></div><main class="container app-conteudo py-4 app-page"><section class="app-surface"><h1 class="h3 mb-2" th:text="${matriculaDisciplina.id == null} ? 'Novo Matrícula' : 'Editar Matrícula'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><p class="aviso">A data de matrícula é definida pela camada Service. Nota final pode ficar vazia.</p><section class="card shadow-sm border-0"><div class="card-body p-4"><form method="post" th:action="@{/bootstrap/matriculas/salvar}"><input name="id" th:value="${matriculaDisciplina.id}" type="hidden"/><div class="mb-3"><label class="form-label fw-semibold" for="discenteId">Discente</label><select class="form-select" id="discenteId" name="discenteId" required=""><option value="">Selecione...</option><option th:each="op : ${discentes}" th:selected="${matriculaDisciplina.discente != null and matriculaDisciplina.discente.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div>
<div class="mb-3"><label class="form-label fw-semibold" for="turmaId">Turma</label><select class="form-select" id="turmaId" name="turmaId" required=""><option value="">Selecione...</option><option th:each="op : ${turmas}" th:selected="${matriculaDisciplina.turma != null and matriculaDisciplina.turma.id == op.id}" th:text="${op.codigo}" th:value="${op.id}"></option></select></div>
<div class="mb-3"><label class="form-label fw-semibold" for="notaFinal">Nota final</label><input class="form-control" id="notaFinal" max="10" min="0" name="notaFinal" step="0.01" th:value="${matriculaDisciplina.notaFinal}" type="number"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="situacao">Situação</label><select class="form-select" id="situacao" name="situacao" required=""><option value="">Selecione...</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'MATRICULADO'}" value="MATRICULADO">Matriculado</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'APROVADO'}" value="APROVADO">Aprovado</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'REPROVADO'}" value="REPROVADO">Reprovado</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'TRANCADO'}" value="TRANCADO">Trancado</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'CANCELADO'}" value="CANCELADO">Cancelado</option></select></div><div class="d-flex gap-2 flex-wrap mt-4"><button class="btn btn-primary" type="submit">Salvar</button><a class="btn btn-outline-secondary" th:href="@{/bootstrap/matriculas}">Cancelar</a></div></form></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
