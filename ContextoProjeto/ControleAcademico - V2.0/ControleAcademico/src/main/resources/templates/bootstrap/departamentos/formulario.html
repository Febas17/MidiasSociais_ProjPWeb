<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Departamento — Sistema Acadêmico</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{bootstrap/fragmentos/menu :: menu}"></div>
<main class="container app-conteudo py-4 app-page">
    <section class="app-surface"><h1 class="h3 mb-2"
                                     th:text="${departamento.id == null} ? 'Novo Departamento' : 'Editar Departamento'">
        Cadastro</h1>
        <p class="subtitulo">Preencha os dados e salve o registro.</p>
        <section class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post" th:action="@{/bootstrap/departamentos/salvar}"><input name="id"
                                                                                          th:value="${departamento.id}"
                                                                                          type="hidden"/>
                    <div class="mb-3"><label class="form-label fw-semibold" for="nome">Nome</label><input
                            class="form-control" id="nome" maxlength="200" name="nome" required=""
                            th:value="${departamento.nome}" type="text"/></div>
                    <div class="mb-3"><label class="form-label fw-semibold" for="sigla">Sigla</label><input
                            class="form-control" id="sigla" maxlength="10" name="sigla" required=""
                            th:value="${departamento.sigla}" type="text"/></div>
                    <div class="d-flex gap-2 flex-wrap mt-4">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/bootstrap/departamentos}">Cancelar</a></div>
                </form>
            </div>
        </section>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
