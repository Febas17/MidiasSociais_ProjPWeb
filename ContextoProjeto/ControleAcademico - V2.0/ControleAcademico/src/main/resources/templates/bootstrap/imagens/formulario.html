<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Imagem — Sistema Acadêmico</title><link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
<link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/></head><body><div th:replace="~{bootstrap/fragmentos/menu :: menu}"></div><main class="container app-conteudo py-4 app-page"><section class="app-surface"><h1 class="h3 mb-2" th:text="${imagem.id == null} ? 'Novo Imagem' : 'Editar Imagem'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><p class="aviso">Aceita PNG, JPEG e WebP até 2 MB. O cadastro não tem edição: substitua removendo a imagem anterior.</p><section class="card shadow-sm border-0"><div class="card-body p-4"><form enctype="multipart/form-data" method="post" th:action="@{/bootstrap/imagens/salvar}"><div class="mb-3"><label class="form-label fw-semibold" for="discenteId">Discente</label><select class="form-select" id="discenteId" name="discenteId" required=""><option value="">Selecione...</option><option th:each="op : ${discentes}" th:selected="false" th:text="${op.nome}" th:value="${op.id}"></option></select></div>
<div class="mb-3"><label class="form-label fw-semibold" for="arquivo">Imagem (PNG, JPEG ou WebP)</label><input accept="image/png,image/jpeg,image/webp" class="form-control" id="arquivo" name="arquivo" required="" type="file"/></div><div class="d-flex gap-2 flex-wrap mt-4"><button class="btn btn-primary" type="submit">Salvar</button><a class="btn btn-outline-secondary" th:href="@{/bootstrap/imagens}">Cancelar</a></div></form></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
