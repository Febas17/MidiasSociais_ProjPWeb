<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Turma — Sistema Acadêmico</title><link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
<link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/></head><body><div th:replace="~{bootstrap/fragmentos/menu :: menu}"></div><main class="container app-conteudo py-4 app-page"><section class="app-surface"><h1 class="h3 mb-2" th:text="${turma.id == null} ? 'Novo Turma' : 'Editar Turma'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><section class="card shadow-sm border-0"><div class="card-body p-4"><form method="post" th:action="@{/bootstrap/turmas/salvar}"><input name="id" th:value="${turma.id}" type="hidden"/><div class="mb-3"><label class="form-label fw-semibold" for="codigo">Código</label><input class="form-control" id="codigo" maxlength="30" name="codigo" required="" th:value="${turma.codigo}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="ano">Ano</label><input class="form-control" id="ano" max="2100" min="2000" name="ano" required="" step="1" th:value="${turma.ano}" type="number"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="semestre">Semestre</label><select class="form-select" id="semestre" name="semestre" required=""><option value="">Selecione...</option><option th:selected="${turma.semestre != null and turma.semestre.toString() == '1'}" value="1">1º semestre</option><option th:selected="${turma.semestre != null and turma.semestre.toString() == '2'}" value="2">2º semestre</option></select></div>
<div class="mb-3"><label class="form-label fw-semibold" for="disciplinaId">Disciplina</label><select class="form-select" id="disciplinaId" name="disciplinaId" required=""><option value="">Selecione...</option><option th:each="op : ${disciplinas}" th:selected="${turma.disciplina != null and turma.disciplina.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div>
<div class="mb-3"><label class="form-label fw-semibold" for="professorId">Professor</label><select class="form-select" id="professorId" name="professorId" required=""><option value="">Selecione...</option><option th:each="op : ${professores}" th:selected="${turma.professor != null and turma.professor.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div><div class="d-flex gap-2 flex-wrap mt-4"><button class="btn btn-primary" type="submit">Salvar</button><a class="btn btn-outline-secondary" th:href="@{/bootstrap/turmas}">Cancelar</a></div></form></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
