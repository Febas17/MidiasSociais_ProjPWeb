<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Disciplina — Sistema Acadêmico</title><link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
<link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/></head><body><div th:replace="~{bootstrap/fragmentos/menu :: menu}"></div><main class="container app-conteudo py-4 app-page"><section class="app-surface"><h1 class="h3 mb-2" th:text="${disciplina.id == null} ? 'Novo Disciplina' : 'Editar Disciplina'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><section class="card shadow-sm border-0"><div class="card-body p-4"><form method="post" th:action="@{/bootstrap/disciplinas/salvar}"><input name="id" th:value="${disciplina.id}" type="hidden"/><div class="mb-3"><label class="form-label fw-semibold" for="codigo">Código</label><input class="form-control" id="codigo" maxlength="30" name="codigo" required="" th:value="${disciplina.codigo}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="nome">Nome</label><input class="form-control" id="nome" maxlength="150" name="nome" required="" th:value="${disciplina.nome}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="cargaHoraria">Carga horária (h)</label><input class="form-control" id="cargaHoraria" min="1" name="cargaHoraria" required="" step="1" th:value="${disciplina.cargaHoraria}" type="number"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="cursoId">Curso</label><select class="form-select" id="cursoId" name="cursoId" required=""><option value="">Selecione...</option><option th:each="op : ${cursos}" th:selected="${disciplina.curso != null and disciplina.curso.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div><div class="d-flex gap-2 flex-wrap mt-4"><button class="btn btn-primary" type="submit">Salvar</button><a class="btn btn-outline-secondary" th:href="@{/bootstrap/disciplinas}">Cancelar</a></div></form></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
