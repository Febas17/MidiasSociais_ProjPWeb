<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Endereço — Sistema Acadêmico</title><link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
<link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/></head><body><div th:replace="~{bootstrap/fragmentos/menu :: menu}"></div><main class="container app-conteudo py-4 app-page"><section class="app-surface"><h1 class="h3 mb-2" th:text="${endereco.id == null} ? 'Novo Endereço' : 'Editar Endereço'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><p class="aviso">O formulário informa o endereço manualmente; não consulta a API ViaCEP.</p><section class="card shadow-sm border-0"><div class="card-body p-4"><form method="post" th:action="@{/bootstrap/enderecos/salvar}"><input name="id" th:value="${endereco.id}" type="hidden"/><div class="mb-3"><label class="form-label fw-semibold" for="cep">CEP</label><input class="form-control" id="cep" inputmode="numeric" maxlength="9" name="cep" placeholder="00000-000" required="" th:value="${endereco.cep}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="logradouro">Logradouro</label><input class="form-control" id="logradouro" maxlength="200" name="logradouro" required="" th:value="${endereco.logradouro}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="numero">Número</label><input class="form-control" id="numero" maxlength="20" name="numero" th:value="${endereco.numero}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="complemento">Complemento</label><input class="form-control" id="complemento" maxlength="100" name="complemento" th:value="${endereco.complemento}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="bairro">Bairro</label><input class="form-control" id="bairro" maxlength="100" name="bairro" required="" th:value="${endereco.bairro}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="cidade">Cidade</label><input class="form-control" id="cidade" maxlength="100" name="cidade" required="" th:value="${endereco.cidade}" type="text"/></div>
<div class="mb-3"><label class="form-label fw-semibold" for="uf">UF</label><input class="form-control" id="uf" maxlength="2" name="uf" required="" th:value="${endereco.uf}" type="text"/></div><div class="d-flex gap-2 flex-wrap mt-4"><button class="btn btn-primary" type="submit">Salvar</button><a class="btn btn-outline-secondary" th:href="@{/bootstrap/enderecos}">Cancelar</a></div></form></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
