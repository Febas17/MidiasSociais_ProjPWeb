<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Discentes — Sistema Acadêmico
  </title>
  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
  <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
 </head>
 <body>
  <div th:replace="~{bootstrap/fragmentos/menu :: menu}">
  </div>
  <main class="container app-conteudo py-4 app-page">
   <section class="app-surface">
    <div class="titulo-linha mb-3">
     <div>
      <h1 class="h3 mb-1">
       Discentes
      </h1>
      <p class="subtitulo mb-0">
       Consulte e gerencie os registros acadêmicos.
      </p>
     </div>
     <a class="btn btn-primary" th:href="@{/bootstrap/discentes/novo}">
      + Novo registro
     </a>
    </div>
    <div class="alert alert-success" role="status" th:if="${mensagem}" th:text="${mensagem}">
    </div>
    <div class="card shadow-sm border-0">
     <div class="card-body">
      <div class="table-responsive">
       <table class="table table-hover table-striped align-middle mb-0">
        <thead>
         <tr>
          <th scope="col">
           Foto
          </th>
          <th scope="col">
           Matrícula
          </th>
          <th scope="col">
           Nome
          </th>
          <th scope="col">
           Curso
          </th>
          <th scope="col">
           CEP do endereço
          </th>
          <th scope="col">
           Ações
          </th>
         </tr>
        </thead>
        <tbody>
         <tr th:each="item : ${discentes}">
          <td style="width: 64px; white-space: nowrap;">
           <img loading="lazy" onerror="this.style.visibility='hidden'" style="display:block;width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid #d5dce4;" th:alt="${'Foto de ' + item.nome}" th:src="@{/discentes/{id}/foto(id=${item.id})}"/>
          </td>
          <td th:text="${item.matricula}">
           —
          </td>
          <td th:text="${item.nome}">
           —
          </td>
          <td th:text="${item.curso.nome}">
           —
          </td>
          <td th:text="${item.endereco.cep}">
           —
          </td>
          <td>
           <div class="acoes" style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;">
            <a class="btn btn-sm btn-outline-primary" style="white-space:nowrap;" th:href="@{/bootstrap/discentes/{id}/editar(id=${item.id})}">
             Editar
            </a>
            <form method="post" style="display:inline-flex;margin:0;" th:action="@{/bootstrap/discentes/{id}/excluir(id=${item.id})}">
             <button class="btn btn-sm btn-outline-danger" style="white-space:nowrap;" type="submit">
              Excluir
             </button>
            </form>
           </div>
          </td>
         </tr>
         <tr th:if="${#lists.isEmpty(discentes)}">
          <td class="estado-vazio" colspan="6">
           Nenhum registro encontrado.
          </td>
         </tr>
        </tbody>
       </table>
      </div>
     </div>
    </div>
   </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
 </body>
</html>
