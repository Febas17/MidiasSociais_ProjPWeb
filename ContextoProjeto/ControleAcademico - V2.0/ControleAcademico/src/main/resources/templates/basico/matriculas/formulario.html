<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Matrícula — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><h1 class="" th:text="${matriculaDisciplina.id == null} ? 'Novo Matrícula' : 'Editar Matrícula'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><p class="aviso">A data de matrícula é definida pela camada Service. Nota final pode ficar vazia.</p><section class="painel"><form method="post" th:action="@{/basico/matriculas/salvar}"><input name="id" th:value="${matriculaDisciplina.id}" type="hidden"/><div class="campo"><label for="discenteId">Discente</label><select class="" id="discenteId" name="discenteId" required=""><option value="">Selecione...</option><option th:each="op : ${discentes}" th:selected="${matriculaDisciplina.discente != null and matriculaDisciplina.discente.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div>
<div class="campo"><label for="turmaId">Turma</label><select class="" id="turmaId" name="turmaId" required=""><option value="">Selecione...</option><option th:each="op : ${turmas}" th:selected="${matriculaDisciplina.turma != null and matriculaDisciplina.turma.id == op.id}" th:text="${op.codigo}" th:value="${op.id}"></option></select></div>
<div class="campo"><label for="notaFinal">Nota final</label><input class="" id="notaFinal" max="10" min="0" name="notaFinal" step="0.01" th:value="${matriculaDisciplina.notaFinal}" type="number"/></div>
<div class="campo"><label for="situacao">Situação</label><select class="" id="situacao" name="situacao" required=""><option value="">Selecione...</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'MATRICULADO'}" value="MATRICULADO">Matriculado</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'APROVADO'}" value="APROVADO">Aprovado</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'REPROVADO'}" value="REPROVADO">Reprovado</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'TRANCADO'}" value="TRANCADO">Trancado</option><option th:selected="${matriculaDisciplina.situacao != null and matriculaDisciplina.situacao.toString() == 'CANCELADO'}" value="CANCELADO">Cancelado</option></select></div><div class="acoes"><button class="botao" type="submit">Salvar</button><a class="botao botao-secundario" th:href="@{/basico/matriculas}">Cancelar</a></div></form></section></section></main></body></html>
