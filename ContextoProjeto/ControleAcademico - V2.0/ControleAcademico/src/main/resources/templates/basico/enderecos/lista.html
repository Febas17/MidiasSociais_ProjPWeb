<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Endereços — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><div class="titulo-linha mb-3"><div><h1 class="">Endereços</h1><p class="subtitulo mb-0">Consulte e gerencie os registros acadêmicos.</p></div><a class="botao" th:href="@{/basico/enderecos/novo}">+ Novo registro</a></div><div class="mensagem" role="status" th:if="${mensagem}" th:text="${mensagem}"></div><div class="painel"><div class="painel-tabela"><table class="tabela"><thead><tr><th scope="col">CEP</th><th scope="col">Logradouro</th><th scope="col">Número</th><th scope="col">Bairro</th><th scope="col">Cidade</th><th scope="col">UF</th><th scope="col">Ações</th></tr></thead><tbody><tr th:each="item : ${enderecos}"><td th:text="${item.cep}">—</td><td th:text="${item.logradouro}">—</td><td th:text="${item.numero}">—</td><td th:text="${item.bairro}">—</td><td th:text="${item.cidade}">—</td><td th:text="${item.uf}">—</td><td><div class="acoes"><a class="botao botao-secundario" th:href="@{/basico/enderecos/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/basico/enderecos/{id}/excluir(id=${item.id})}"><button class="botao botao-perigo" type="submit">Excluir</button></form></div></td></tr><tr th:if="${#lists.isEmpty(enderecos)}"><td class="estado-vazio" colspan="7">Nenhum registro encontrado.</td></tr></tbody></table></div></div></section></main></body></html>
