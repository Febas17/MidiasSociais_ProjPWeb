<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Imagem — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><h1 class="" th:text="${imagem.id == null} ? 'Novo Imagem' : 'Editar Imagem'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><p class="aviso">Aceita PNG, JPEG e WebP até 2 MB. O cadastro não tem edição: substitua removendo a imagem anterior.</p><section class="painel"><form enctype="multipart/form-data" method="post" th:action="@{/basico/imagens/salvar}"><div class="campo"><label for="discenteId">Discente</label><select class="" id="discenteId" name="discenteId" required=""><option value="">Selecione...</option><option th:each="op : ${discentes}" th:selected="false" th:text="${op.nome}" th:value="${op.id}"></option></select></div>
<div class="campo"><label for="arquivo">Imagem (PNG, JPEG ou WebP)</label><input accept="image/png,image/jpeg,image/webp" class="" id="arquivo" name="arquivo" required="" type="file"/></div><div class="acoes"><button class="botao" type="submit">Salvar</button><a class="botao botao-secundario" th:href="@{/basico/imagens}">Cancelar</a></div></form></section></section></main></body></html>
