<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Endereço — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><h1 class="" th:text="${endereco.id == null} ? 'Novo Endereço' : 'Editar Endereço'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><p class="aviso">O formulário informa o endereço manualmente; não consulta a API ViaCEP.</p><section class="painel"><form method="post" th:action="@{/basico/enderecos/salvar}"><input name="id" th:value="${endereco.id}" type="hidden"/><div class="campo"><label for="cep">CEP</label><input class="" id="cep" inputmode="numeric" maxlength="9" name="cep" placeholder="00000-000" required="" th:value="${endereco.cep}" type="text"/></div>
<div class="campo"><label for="logradouro">Logradouro</label><input class="" id="logradouro" maxlength="200" name="logradouro" required="" th:value="${endereco.logradouro}" type="text"/></div>
<div class="campo"><label for="numero">Número</label><input class="" id="numero" maxlength="20" name="numero" th:value="${endereco.numero}" type="text"/></div>
<div class="campo"><label for="complemento">Complemento</label><input class="" id="complemento" maxlength="100" name="complemento" th:value="${endereco.complemento}" type="text"/></div>
<div class="campo"><label for="bairro">Bairro</label><input class="" id="bairro" maxlength="100" name="bairro" required="" th:value="${endereco.bairro}" type="text"/></div>
<div class="campo"><label for="cidade">Cidade</label><input class="" id="cidade" maxlength="100" name="cidade" required="" th:value="${endereco.cidade}" type="text"/></div>
<div class="campo"><label for="uf">UF</label><input class="" id="uf" maxlength="2" name="uf" required="" th:value="${endereco.uf}" type="text"/></div><div class="acoes"><button class="botao" type="submit">Salvar</button><a class="botao botao-secundario" th:href="@{/basico/enderecos}">Cancelar</a></div></form></section></section></main></body></html>
