<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Disciplina — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><h1 class="" th:text="${disciplina.id == null} ? 'Novo Disciplina' : 'Editar Disciplina'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><section class="painel"><form method="post" th:action="@{/basico/disciplinas/salvar}"><input name="id" th:value="${disciplina.id}" type="hidden"/><div class="campo"><label for="codigo">Código</label><input class="" id="codigo" maxlength="30" name="codigo" required="" th:value="${disciplina.codigo}" type="text"/></div>
<div class="campo"><label for="nome">Nome</label><input class="" id="nome" maxlength="150" name="nome" required="" th:value="${disciplina.nome}" type="text"/></div>
<div class="campo"><label for="cargaHoraria">Carga horária (h)</label><input class="" id="cargaHoraria" min="1" name="cargaHoraria" required="" step="1" th:value="${disciplina.cargaHoraria}" type="number"/></div>
<div class="campo"><label for="cursoId">Curso</label><select class="" id="cursoId" name="cursoId" required=""><option value="">Selecione...</option><option th:each="op : ${cursos}" th:selected="${disciplina.curso != null and disciplina.curso.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div><div class="acoes"><button class="botao" type="submit">Salvar</button><a class="botao botao-secundario" th:href="@{/basico/disciplinas}">Cancelar</a></div></form></section></section></main></body></html>
