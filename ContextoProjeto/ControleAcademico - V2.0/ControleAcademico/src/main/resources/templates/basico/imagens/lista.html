<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Imagens dos discentes — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><div class="titulo-linha mb-3"><div><h1 class="">Imagens dos discentes</h1><p class="subtitulo mb-0">Consulte e gerencie os registros acadêmicos.</p></div><a class="botao" th:href="@{/basico/imagens/novo}">+ Novo registro</a></div><div class="mensagem" role="status" th:if="${mensagem}" th:text="${mensagem}"></div><div class="painel"><div class="painel-tabela"><table class="tabela"><thead><tr><th scope="col">Discente</th><th scope="col">Arquivo</th><th scope="col">Tipo</th><th scope="col">Visualização</th><th scope="col">Ações</th></tr></thead><tbody><tr th:each="item : ${imagens}"><td th:text="${item.discente.nome}">—</td><td th:text="${item.nomeArquivo}">—</td><td th:text="${item.tipoMime}">—</td><td><a class="botao botao-secundario" rel="noopener" target="_blank" th:href="@{/basico/imagens/{id}/arquivo(id=${item.id})}">Visualizar</a></td><td><div class="acoes"><form method="post" th:action="@{/basico/imagens/{id}/excluir(id=${item.id})}"><button class="botao botao-perigo" type="submit">Excluir</button></form></div></td></tr><tr th:if="${#lists.isEmpty(imagens)}"><td class="estado-vazio" colspan="5">Nenhum registro encontrado.</td></tr></tbody></table></div></div></section></main></body></html>
