<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Curso — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><h1 class="" th:text="${curso.id == null} ? 'Novo Curso' : 'Editar Curso'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><section class="painel"><form method="post" th:action="@{/basico/cursos/salvar}"><input name="id" th:value="${curso.id}" type="hidden"/><div class="campo"><label for="nome">Nome</label><input class="" id="nome" maxlength="100" name="nome" required="" th:value="${curso.nome}" type="text"/></div>
<div class="campo"><label for="sigla">Sigla</label><input class="" id="sigla" maxlength="20" name="sigla" required="" th:value="${curso.sigla}" type="text"/></div>
<div class="campo"><label for="departamentoId">Departamento</label><select class="" id="departamentoId" name="departamentoId" required=""><option value="">Selecione...</option><option th:each="op : ${departamentos}" th:selected="${curso.departamento != null and curso.departamento.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div><div class="acoes"><button class="botao" type="submit">Salvar</button><a class="botao botao-secundario" th:href="@{/basico/cursos}">Cancelar</a></div></form></section></section></main></body></html>
