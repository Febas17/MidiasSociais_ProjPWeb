<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Professor — Sistema Acadêmico</title>
<link rel="stylesheet" th:href="@{/css/basico.css}"></head>
<body><div th:replace="~{basico/fragmentos/menu :: menu}"></div>
<main class="conteudo app-page"><section class="app-surface">
<h1 th:text="${professor.id == null} ? 'Novo Professor' : 'Editar Professor'">Novo Professor</h1>
<form method="post" enctype="multipart/form-data" th:action="@{/basico/professores/salvar}">
<input type="hidden" name="id" th:value="${professor.id}">
<div class="campo"><label for="registro">Registro</label>
<input class="" id="registro" name="registro" maxlength="40" required th:value="${professor.registro}"></div>
<div class="campo"><label for="nome">Nome completo</label>
<input class="" id="nome" name="nome" maxlength="200" required th:value="${professor.nome}"></div>
<div class="campo"><label for="email">E-mail</label>
<input class="" type="email" id="email" name="email" maxlength="200" th:value="${professor.email}"></div>
<div class="campo"><label for="departamentoId">Departamento</label>
<select class="" name="departamentoId" id="departamentoId" required>
<option value="">Selecione um departamento</option>
<option th:each="d : ${departamentos}" th:value="${d.id}" th:text="${d.nome}"
 th:selected="${professor.departamento != null and professor.departamento.id == d.id}"></option>
</select></div>
<div class="campo"><label for="foto">Fotografia (PNG ou JPEG, até 2 MB)</label>
<div th:if="${professor.id != null}" style="margin:8px 0">
<img th:src="@{/professores/{id}/foto(id=${professor.id})}" width="90" height="90"
 style="border-radius:50%;object-fit:cover" alt="Fotografia atual" onerror="this.style.display='none'">
<p>Se nenhuma nova foto for escolhida, a foto atual será mantida.</p>
</div>
<input class="" type="file" id="foto" name="foto" accept="image/png,image/jpeg"></div>
<div style="display:flex;gap:10px;margin-top:18px;align-items:center">
<button class="botao" type="submit">Salvar professor</button>
<a class="botao botao-secundario" th:href="@{/basico/professores}">Cancelar</a></div>
</form></section></main></body></html>
