<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Matrículas em disciplinas — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><div class="titulo-linha mb-3"><div><h1 class="">Matrículas em disciplinas</h1><p class="subtitulo mb-0">Consulte e gerencie os registros acadêmicos.</p></div><a class="botao" th:href="@{/basico/matriculas/novo}">+ Novo registro</a></div><div class="mensagem" role="status" th:if="${mensagem}" th:text="${mensagem}"></div><div class="painel"><div class="painel-tabela"><table class="tabela"><thead><tr><th scope="col">Discente</th><th scope="col">Turma</th><th scope="col">Data</th><th scope="col">Nota final</th><th scope="col">Situação</th><th scope="col">Ações</th></tr></thead><tbody><tr th:each="item : ${matriculas}"><td th:text="${item.discente.nome}">—</td><td th:text="${item.turma.codigo}">—</td><td th:text="${item.dataMatricula}">—</td><td th:text="${item.notaFinal}">—</td><td th:text="${item.situacao}">—</td><td><div class="acoes"><a class="botao botao-secundario" th:href="@{/basico/matriculas/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/basico/matriculas/{id}/excluir(id=${item.id})}"><button class="botao botao-perigo" type="submit">Excluir</button></form></div></td></tr><tr th:if="${#lists.isEmpty(matriculas)}"><td class="estado-vazio" colspan="6">Nenhum registro encontrado.</td></tr></tbody></table></div></div></section></main></body></html>
