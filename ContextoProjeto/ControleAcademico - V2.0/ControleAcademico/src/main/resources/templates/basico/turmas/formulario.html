<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro de Turma — Sistema Acadêmico</title>
<link href="/css/basico.css" rel="stylesheet" th:href="@{/css/basico.css}"/></head><body><div th:replace="~{basico/fragmentos/menu :: menu}"></div><main class="conteudo app-page"><section class="app-surface"><h1 class="" th:text="${turma.id == null} ? 'Novo Turma' : 'Editar Turma'">Cadastro</h1><p class="subtitulo">Preencha os dados e salve o registro.</p><section class="painel"><form method="post" th:action="@{/basico/turmas/salvar}"><input name="id" th:value="${turma.id}" type="hidden"/><div class="campo"><label for="codigo">Código</label><input class="" id="codigo" maxlength="30" name="codigo" required="" th:value="${turma.codigo}" type="text"/></div>
<div class="campo"><label for="ano">Ano</label><input class="" id="ano" max="2100" min="2000" name="ano" required="" step="1" th:value="${turma.ano}" type="number"/></div>
<div class="campo"><label for="semestre">Semestre</label><select class="" id="semestre" name="semestre" required=""><option value="">Selecione...</option><option th:selected="${turma.semestre != null and turma.semestre.toString() == '1'}" value="1">1º semestre</option><option th:selected="${turma.semestre != null and turma.semestre.toString() == '2'}" value="2">2º semestre</option></select></div>
<div class="campo"><label for="disciplinaId">Disciplina</label><select class="" id="disciplinaId" name="disciplinaId" required=""><option value="">Selecione...</option><option th:each="op : ${disciplinas}" th:selected="${turma.disciplina != null and turma.disciplina.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div>
<div class="campo"><label for="professorId">Professor</label><select class="" id="professorId" name="professorId" required=""><option value="">Selecione...</option><option th:each="op : ${professores}" th:selected="${turma.professor != null and turma.professor.id == op.id}" th:text="${op.nome}" th:value="${op.id}"></option></select></div><div class="acoes"><button class="botao" type="submit">Salvar</button><a class="botao botao-secundario" th:href="@{/basico/turmas}">Cancelar</a></div></form></section></section></main></body></html>
