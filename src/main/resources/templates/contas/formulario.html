<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Salvar Conta - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <main class="app-container">
        <div class="app-surface form-card">
            <div class="titulo-linha">
                <div>
                    <h1 th:text="${conta.idConta == null} ? 'Cadastrar Nova Conta' : 'Editar Conta'">Conta</h1>
                    <p>Preencha os dados cadastrais da empresa cliente para monitoramento.</p>
                </div>
                <a th:href="@{/contas}" class="btn-modern-outline">
                    <i class="bi bi-arrow-left"></i> Voltar à Lista
                </a>
            </div>

            <form th:action="@{/contas/salvar}" th:object="${conta}" method="post">
                <input type="hidden" th:field="*{idConta}">

                <div class="mb-4">
                    <label class="form-label">Nome da Marca / Conta Empresarial</label>
                    <input type="text" class="form-control" th:field="*{nomeConta}" required placeholder="Ex: Tech Varejo S.A.">
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Segmento de Atuação</label>
                        <input type="text" class="form-control" th:field="*{segmento}" placeholder="Ex: Varejo, Finanças, Saúde">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Porte da Empresa</label>
                        <select class="form-select" th:field="*{porteEmpresa}">
                            <option value="Pequeno porte">Pequeno porte</option>
                            <option value="Médio porte">Médio porte</option>
                            <option value="Grande porte">Grande porte</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-5">
                        <label class="form-label">Cidade</label>
                        <input type="text" class="form-control" th:field="*{cidade}" placeholder="Ex: São Paulo">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">UF</label>
                        <input type="text" class="form-control" th:field="*{estado}" maxlength="2" placeholder="SP">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Região</label>
                        <select class="form-select" th:field="*{regiao}">
                            <option value="Sudeste">Sudeste</option>
                            <option value="Sul">Sul</option>
                            <option value="Nordeste">Nordeste</option>
                            <option value="Centro-Oeste">Centro-Oeste</option>
                            <option value="Norte">Norte</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Ano de Início das Operações</label>
                        <input type="number" class="form-control" th:field="*{anoInicioOperacao}" min="1900" max="2026" placeholder="2016">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Status da Conta</label>
                        <select class="form-select" th:field="*{statusConta}">
                            <option value="Ativa">Ativa</option>
                            <option value="Inativa">Inativa</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/contas}" class="btn-modern-outline">Cancelar</a>
                    <button type="submit" class="btn-modern-primary">
                        <i class="bi bi-check2-circle"></i> Salvar Registro
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
