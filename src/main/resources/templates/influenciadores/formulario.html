<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Influenciador - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <main class="app-container">
        <div class="app-surface form-card">
            <div class="titulo-linha">
                <div>
                    <h1 th:text="${influenciador.idInfluenciador == null ? 'Novo Influenciador' : 'Editar Influenciador'}">Cadastro de Influenciador</h1>
                    <p>Dados do criador de conteúdo e métricas médias de engajamento.</p>
                </div>
                <a class="btn-modern-outline" th:href="@{/influenciadores}">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>

            <form th:action="@{/influenciadores/salvar}" th:object="${influenciador}" method="post">
                <input type="hidden" th:field="*{idInfluenciador}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nome / Identificação</label>
                        <input type="text" class="form-control" th:field="*{nomeAnonimizado}" required/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nicho</label>
                        <input type="text" class="form-control" th:field="*{nicho}" placeholder="Ex: Finanças, Moda, Fitness"/>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Plataforma Principal</label>
                        <select class="form-select" th:field="*{plataformaPrincipal}">
                            <option value="Instagram">Instagram</option>
                            <option value="YouTube">YouTube</option>
                            <option value="TikTok">TikTok</option>
                            <option value="LinkedIn">LinkedIn</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Seguidores</label>
                        <input type="number" class="form-control" th:field="*{seguidores}" min="0"/>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Taxa de Engajamento</label>
                        <input type="number" step="0.0001" class="form-control" th:field="*{taxaEngajamentoMedia}" min="0"/>
                    </div>

                    <div class="col-md-5">
                        <label class="form-label">Cidade</label>
                        <input type="text" class="form-control" th:field="*{cidade}"/>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Estado (UF)</label>
                        <input type="text" class="form-control" th:field="*{estado}" maxlength="10"/>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Região</label>
                        <select class="form-select" th:field="*{regiao}">
                            <option value="Sudeste">Sudeste</option>
                            <option value="Sul">Sul</option>
                            <option value="Nordeste">Nordeste</option>
                            <option value="Centro-Oeste">Centro-Oeste</option>
                            <option value="Norte">Norte</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Status da Parceria</label>
                        <select class="form-select" th:field="*{statusParceria}">
                            <option value="Ativa">Ativa</option>
                            <option value="Em negociação">Em negociação</option>
                            <option value="Finalizada">Finalizada</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end gap-2">
                    <a class="btn-modern-outline" th:href="@{/influenciadores}">Cancelar</a>
                    <button type="submit" class="btn-modern-primary">
                        <i class="bi bi-check-lg"></i> Salvar Influenciador
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
