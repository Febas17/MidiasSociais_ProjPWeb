<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Post - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <main class="app-container">
        <div class="app-surface form-card">
            <div class="titulo-linha">
                <div>
                    <h1 th:text="${post.idPost == null ? 'Novo Post' : 'Editar Post'}">Cadastro de Post</h1>
                    <p>Gerencie os detalhes da publicação e vinculação com perfil e campanha.</p>
                </div>
                <a class="btn-modern-outline" th:href="@{/posts}">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>

            <form th:action="@{/posts/salvar}" th:object="${post}" method="post">
                <input type="hidden" th:field="*{idPost}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Perfil Social</label>
                        <select class="form-select" th:field="*{perfil.idPerfil}" required>
                            <option value="">Selecione um perfil...</option>
                            <option th:each="p : ${perfis}" th:value="${p.idPerfil}" th:text="${p.nomePerfil + ' (' + p.plataforma + ')'}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Campanha (Opcional)</label>
                        <select class="form-select" th:field="*{campanha.idCampanha}">
                            <option value="">Sem campanha vinculada</option>
                            <option th:each="c : ${campanhas}" th:value="${c.idCampanha}" th:text="${c.nomeCampanha}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tema do Conteúdo</label>
                        <input type="text" class="form-control" th:field="*{temaConteudo}" required/>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Tipo de Conteúdo</label>
                        <select class="form-select" th:field="*{tipoConteudo}">
                            <option value="Carrossel">Carrossel</option>
                            <option value="Vídeo curto">Vídeo curto</option>
                            <option value="Vídeo longo">Vídeo longo</option>
                            <option value="Imagem">Imagem</option>
                            <option value="Texto">Texto</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Data de Publicação</label>
                        <input type="date" class="form-control" th:field="*{dataPublicacao}"/>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Objetivo</label>
                        <input type="text" class="form-control" th:field="*{objetivo}" placeholder="Ex: Engajamento, Conversão"/>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Canal de Origem</label>
                        <select class="form-select" th:field="*{canalOrigem}">
                            <option value="Orgânico">Orgânico</option>
                            <option value="Pago">Pago</option>
                            <option value="Impulsionado">Impulsionado</option>
                            <option value="Parceria">Parceria</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Status do Post</label>
                        <select class="form-select" th:field="*{statusPost}">
                            <option value="Publicado">Publicado</option>
                            <option value="Agendado">Agendado</option>
                            <option value="Arquivado">Arquivado</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Duração Vídeo (seg)</label>
                        <input type="number" class="form-control" th:field="*{duracaoVideoSegundos}" min="0"/>
                    </div>

                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" th:field="*{possuiLink}" id="possuiLink"/>
                            <label class="form-check-label" for="possuiLink">Possui Link Externo</label>
                        </div>
                    </div>

                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" th:field="*{possuiCta}" id="possuiCta"/>
                            <label class="form-check-label" for="possuiCta">Possui CTA</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end gap-2">
                    <a class="btn-modern-outline" th:href="@{/posts}">Cancelar</a>
                    <button type="submit" class="btn-modern-primary">
                        <i class="bi bi-check-lg"></i> Salvar Post
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
