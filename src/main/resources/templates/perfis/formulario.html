<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Perfil Social - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <main class="app-container">
        <div class="app-surface form-card">
            <div class="titulo-linha">
                <div>
                    <h1 th:text="${perfil.idPerfil == null ? 'Novo Perfil Social' : 'Editar Perfil Social'}">Cadastro de Perfil Social</h1>
                    <p>Configure a rede social vinculada à conta cliente.</p>
                </div>
                <a class="btn-modern-outline" th:href="@{/perfis}">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>

            <form th:action="@{/perfis/salvar}" th:object="${perfil}" method="post">
                <input type="hidden" th:field="*{idPerfil}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Conta Cliente</label>
                        <select class="form-select" th:field="*{conta.idConta}" required>
                            <option value="">Selecione uma conta...</option>
                            <option th:each="c : ${contas}" th:value="${c.idConta}" th:text="${c.nomeConta}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Plataforma</label>
                        <select class="form-select" th:field="*{plataforma}" required>
                            <option value="Instagram">Instagram</option>
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="TikTok">TikTok</option>
                            <option value="YouTube">YouTube</option>
                            <option value="Facebook">Facebook</option>
                            <option value="X/Twitter">X/Twitter</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nome do Perfil (@)</label>
                        <input type="text" class="form-control" th:field="*{nomePerfil}" required/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Categoria do Perfil</label>
                        <input type="text" class="form-control" th:field="*{categoriaPerfil}" placeholder="Ex: Institucional, Atendimento"/>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Seguidores Atuais</label>
                        <input type="number" class="form-control" th:field="*{seguidoresAtuais}" min="0"/>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Data de Criação</label>
                        <input type="date" class="form-control" th:field="*{dataCriacao}"/>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{statusPerfil}">
                            <option value="Ativo">Ativo</option>
                            <option value="Pausado">Pausado</option>
                            <option value="Inativo">Inativo</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end gap-2">
                    <a class="btn-modern-outline" th:href="@{/perfis}">Cancelar</a>
                    <button type="submit" class="btn-modern-primary">
                        <i class="bi bi-check-lg"></i> Salvar Perfil
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
