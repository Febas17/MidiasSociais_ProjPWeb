<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Perfis de Redes Sociais - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <main class="app-container">
        <div class="app-surface">
            <div class="titulo-linha">
                <div>
                    <h1>Perfis Sociais Conectados</h1>
                    <p>Contas de redes sociais vinculadas às marcas corporativas.</p>
                </div>
                <a class="btn-clean-primary" th:href="@{/perfis/novo}">
                    <i class="bi bi-plus-lg"></i> Conectar Perfil
                </a>
            </div>

            <div class="custom-table-container">
                <div class="table-responsive">
                    <table class="table table-custom align-middle">
                        <thead>
                            <tr>
                                <th># ID</th>
                                <th>Rede Social</th>
                                <th>@ Perfil</th>
                                <th>Conta Associada</th>
                                <th>Seguidores</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${perfis}">
                                <td class="fw-bold text-muted" th:text="'#' + ${p.idPerfil}">#1</td>
                                <td>
                                    <span class="badge-tag" th:text="${p.plataforma}">LinkedIn</span>
                                </td>
                                <td>
                                    <span class="fw-bold text-dark" th:text="${p.nomePerfil}">@perfil</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${p.conta != null ? p.conta.nomeConta : '-'}">Marca</span>
                                </td>
                                <td class="fw-bold text-primary" th:text="${#numbers.formatInteger(p.seguidoresAtuais != null ? p.seguidoresAtuais : 0, 1, 'POINT')}">145.000</td>
                                <td>
                                    <span class="badge-status ativa" th:text="${p.statusPerfil}">Ativo</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-2">
                                        <a th:href="@{/perfis/editar/{id}(id=${p.idPerfil})}" class="btn-action-edit">
                                            <i class="bi bi-pencil-square"></i> Editar
                                        </a>
                                        <a th:href="@{/perfis/excluir/{id}(id=${p.idPerfil})}" class="btn-action-del" onclick="return confirm('Deseja realmente excluir?')">
                                            <i class="bi bi-trash3"></i> Excluir
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(perfis)}">
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <i class="bi bi-share fs-1 d-block mb-2 text-secondary"></i>
                                    Nenhum perfil social conectado.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
