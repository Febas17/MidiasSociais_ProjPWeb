<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
</head>
<body>
<div th:fragment="menu">
    <header class="app-header">
        <a class="app-brand" href="/" th:href="@{/}">
            <span class="app-brand-text">SocialMetrics</span>
        </a>

        <div class="d-flex align-items-center gap-3">
            <a href="/h2-console" target="_blank" class="h2-link" title="Abrir Console H2">
                <i class="bi bi-database"></i> H2
            </a>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid px-0">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuSocial" aria-controls="menuSocial" aria-expanded="false" aria-label="Menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuSocial">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/' ? 'active' : ''}">
                            <i class="bi bi-grid-1x2-fill"></i> Visão Geral
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contas}" th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/contas') ? 'active' : ''}">
                            <i class="bi bi-buildings-fill"></i> Contas de Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/campanhas}" th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/campanhas') ? 'active' : ''}">
                            <i class="bi bi-megaphone-fill"></i> Campanhas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/perfis}" th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/perfis') ? 'active' : ''}">
                            <i class="bi bi-share-fill"></i> Perfis Sociais
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/posts}" th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/posts') ? 'active' : ''}">
                            <i class="bi bi-file-earmark-post-fill"></i> Posts
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/comentarios}" th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/comentarios') ? 'active' : ''}">
                            <i class="bi bi-chat-dots-fill"></i> Moderação
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/influenciadores}" th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/influenciadores') ? 'active' : ''}">
                            <i class="bi bi-person-badge-fill"></i> Influenciadores
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2 text-muted small fw-semibold">
                    <i class="bi bi-shield-check text-primary fs-6"></i>
                    <span>Ambiente Seguro</span>
                </div>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
