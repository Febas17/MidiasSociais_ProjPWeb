<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Salvar Campanha - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <main class="app-container">
        <div class="app-surface form-card">
            <div class="titulo-linha">
                <div>
                    <h1 th:text="${campanha.idCampanha == null} ? 'Criar Nova Campanha' : 'Editar Campanha'">Campanha</h1>
                    <p>Defina o planejamento estratégico, vigência e orçamento de mídia.</p>
                </div>
                <a th:href="@{/campanhas}" class="btn-modern-outline">
                    <i class="bi bi-arrow-left"></i> Voltar à Lista
                </a>
            </div>

            <form th:action="@{/campanhas/salvar}" th:object="${campanha}" method="post">
                <input type="hidden" th:field="*{idCampanha}">

                <div class="mb-4">
                    <label class="form-label">Nome da Campanha Publicitária</label>
                    <input type="text" class="form-control" th:field="*{nomeCampanha}" required placeholder="Ex: Black Friday 2026 - Lançamento Mobile">
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Conta Cliente Vinculada</label>
                        <select class="form-select" th:field="*{conta}" required>
                            <option value="">Selecione uma marca...</option>
                            <option th:each="c : ${contas}" th:value="${c.idConta}" th:text="${c.nomeConta}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Objetivo Estratégico</label>
                        <select class="form-select" th:field="*{objetivo}">
                            <option value="Conversão">Conversão (Vendas / Leads)</option>
                            <option value="Engajamento">Engajamento de Comunidade</option>
                            <option value="Alcance">Alcance e Reconhecimento</option>
                            <option value="Branding">Employer Branding</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Data de Início da Vigência</label>
                        <input type="date" class="form-control" th:field="*{dataInicio}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Data de Conclusão / Término</label>
                        <input type="date" class="form-control" th:field="*{dataFim}" required>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Orçamento Total Planejado (R$)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{orcamentoPlanejado}" placeholder="50000.00">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Canal de Origem</label>
                        <input type="text" class="form-control" th:field="*{canalOrigem}" placeholder="Ex: Impulsionado, Orgânico">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Situação da Campanha</label>
                        <select class="form-select" th:field="*{statusCampanha}">
                            <option value="Ativa">Ativa</option>
                            <option value="Pausada">Pausada</option>
                            <option value="Encerrada">Encerrada</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/campanhas}" class="btn-modern-outline">Cancelar</a>
                    <button type="submit" class="btn-modern-primary">
                        <i class="bi bi-check2-circle"></i> Salvar Campanha
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
