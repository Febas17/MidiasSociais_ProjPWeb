<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Salvar Usuário - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <main class="app-container">
        <div class="app-surface form-card">
            <div class="titulo-linha">
                <div>
                    <h1 th:text="${usuario.idUsuario == null} ? 'Cadastrar Novo Usuário' : 'Editar Usuário'">Usuário</h1>
                    <p>Defina as credenciais e o nível de acesso operacional na plataforma.</p>
                </div>
                <a th:href="@{/usuarios}" class="btn-clean-outline">
                    <i class="bi bi-arrow-left"></i> Voltar à Lista
                </a>
            </div>

            <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{idUsuario}">

                <div class="mb-4">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" th:field="*{nome}" required placeholder="Ex: Fabrício Saraiva">
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Nome de Usuário (Login)</label>
                        <input type="text" class="form-control" th:field="*{username}" required placeholder="Ex: fabricio.saraiva">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Senha de Acesso</label>
                        <input type="password" class="form-control" th:field="*{senha}" required placeholder="••••••••">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Email Corporativo</label>
                        <input type="email" class="form-control" th:field="*{email}" required placeholder="usuario@eseg.edu.br">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Perfil de Acesso (RBAC)</label>
                        <select class="form-select" th:field="*{perfil}" required>
                            <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-4 form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="ativoCheck" th:field="*{ativo}">
                    <label class="form-check-label fw-bold" for="ativoCheck">Conta de usuário ativa no sistema</label>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/usuarios}" class="btn-clean-outline">Cancelar</a>
                    <button type="submit" class="btn-clean-primary">
                        <i class="bi bi-check2-circle"></i> Salvar Usuário
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
