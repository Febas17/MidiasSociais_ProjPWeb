<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Entrar - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-box">
            <div class="text-center mb-4">
                <span class="app-brand-text">SocialMetrics</span>
                <p class="text-muted mt-2 mb-0" style="font-size: 0.88rem;">Painel de Inteligência & Gestão de Mídias Sociais</p>
            </div>

            <div th:if="${mensagemErro}" class="alert alert-danger py-2 px-3 small border-0 d-flex align-items-center gap-2 mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${mensagemErro}">Mensagem de erro</span>
            </div>

            <div th:if="${mensagemSucesso}" class="alert alert-success py-2 px-3 small border-0 d-flex align-items-center gap-2 mb-3">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${mensagemSucesso}">Mensagem de sucesso</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Usuário ou E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" id="username" name="username" class="form-control border-start-0" placeholder="ex: fabricio ou analista" required autofocus />
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="senha">Senha de Acesso</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" id="senha" name="senha" class="form-control border-start-0" placeholder="••••••••" required />
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background: var(--c-dark-navy); border-color: var(--c-dark-navy);">
                    Acessar Plataforma <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="demo-credentials mt-4 pt-3 border-top text-muted small">
                <div class="fw-semibold text-dark mb-1">Acesso de Demonstração:</div>
                <div class="d-flex justify-content-between mb-1">
                    <span>👑 <strong>ADMIN:</strong> fabricio / admin123</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span>📊 <strong>ANALISTA:</strong> analista / analista123</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
