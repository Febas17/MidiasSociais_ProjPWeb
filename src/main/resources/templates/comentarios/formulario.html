<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Moderação de Comentário - SocialMetrics</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/estilo-midias.css" rel="stylesheet" th:href="@{/css/estilo-midias.css}"/>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <main class="app-container">
        <div class="app-surface form-card">
            <div class="titulo-linha">
                <div>
                    <h1 th:text="${comentario.idComentario == null ? 'Novo Comentário' : 'Moderar Comentário #' + comentario.idComentario}">Moderar Comentário</h1>
                    <p>Classifique o sentimento, categoria e status de moderação.</p>
                </div>
                <a class="btn-modern-outline" th:href="@{/comentarios}">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>

            <form th:action="@{/comentarios/salvar}" th:object="${comentario}" method="post">
                <input type="hidden" th:field="*{idComentario}"/>

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Post Vinculado</label>
                        <select class="form-select" th:field="*{post.idPost}" required>
                            <option value="">Selecione um post...</option>
                            <option th:each="p : ${posts}" th:value="${p.idPost}" th:text="'#' + ${p.idPost} + ' - ' + ${p.temaConteudo}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Data do Comentário</label>
                        <input type="date" class="form-control" th:field="*{dataComentario}"/>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Texto do Comentário</label>
                        <textarea class="form-control" th:field="*{textoComentario}" rows="3" required></textarea>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Sentimento</label>
                        <select class="form-select" th:field="*{sentimento}">
                            <option value="Positivo">Positivo</option>
                            <option value="Neutro">Neutro</option>
                            <option value="Negativo">Negativo</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Categoria</label>
                        <select class="form-select" th:field="*{categoriaComentario}">
                            <option value="Dúvida">Dúvida</option>
                            <option value="Elogio">Elogio</option>
                            <option value="Reclamação">Reclamação</option>
                            <option value="Sugestão">Sugestão</option>
                            <option value="Pedido comercial">Pedido comercial</option>
                            <option value="Spam">Spam</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Status de Moderação</label>
                        <select class="form-select" th:field="*{statusModeracao}">
                            <option value="Pendente">Pendente</option>
                            <option value="Respondido">Respondido</option>
                            <option value="Ocultado">Ocultado</option>
                            <option value="Não requer resposta">Não requer resposta</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Tempo de Resposta (h)</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{tempoRespostaHoras}" min="0"/>
                    </div>

                    <div class="col-md-8 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" th:field="*{requerAtencao}" id="requerAtencao"/>
                            <label class="form-check-label" for="requerAtencao">Requer Atenção Imediata (Triagem)</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end gap-2">
                    <a class="btn-modern-outline" th:href="@{/comentarios}">Cancelar</a>
                    <button type="submit" class="btn-modern-primary">
                        <i class="bi bi-check-lg"></i> Salvar Moderação
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
