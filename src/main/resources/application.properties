# ======================================================================
# APLICAÇÃO: SISTEMA DE GESTÃO DE MÍDIAS SOCIAIS
# ======================================================================
spring.application.name=MidiasSociais
server.port=8082

# ======================================================================
# DATASOURCE H2 (persistente em arquivo local)
# Sem o DB_CLOSE_ON_EXIT=FALSE conflitante
# ======================================================================
spring.datasource.url=jdbc:h2:file:./database/midias_sociais;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS APP\\;SET SCHEMA APP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ======================================================================
# CONSOLE DO BANCO H2 (http://localhost:8082/h2-console)
# ======================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ======================================================================
# JPA / HIBERNATE
# ======================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=APP

# Logs SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ======================================================================
# THYMELEAF & UTF-8
# ======================================================================
spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
spring.output.ansi.enabled=ALWAYS
